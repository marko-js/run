packages:
  - examples/*
  - packages/*
  - packages/adapters/*
# Dependencies whose postinstall scripts must run (binary downloads/native builds).
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  netlify-cli: true
  sharp: true
  unix-dgram: true
linkWorkspacePackages: true
publicHoistPattern:
  # marko 5's tags-api compiled output imports this dep of marko itself via
  # bare specifiers that resolve from the app/fixture root. It must be
  # resolvable yet UNDECLARED: listing it in a package.json on the lookup
  # path flips marko's api detection and changes how fixtures render
  # (npm's flat layout gave exactly this resolvable-but-undeclared shape).
  - "@marko/runtime-tags"
